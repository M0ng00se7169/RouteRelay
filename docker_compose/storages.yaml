services:
  mongodb:
    container_name: chat-mongodb
    image: mongo:6-jammy
    command: ['--replSet', 'rs0']
    ports:
      - '27017:27017'
    volumes:
      - dbdata6:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend

  init-mongo:
    image: mongo:6-jammy
    container_name: init-mongo
    depends_on:
      mongodb:
        condition: service_healthy
    restart: 'no'
    # List-form command + block scalar: the old quoted-string version died with
    # `syntax error near unexpected token '&&'` (nested YAML/bash quoting), so a
    # FIRST-TIME clone with a fresh volume never got its replica set initiated.
    # Idempotent: skips rs.initiate when the replica set already exists (old
    # volumes). $$ = literal $ after compose variable interpolation.
    command:
      - bash
      - -c
      - |
        if [ "$$(mongosh --quiet --host mongodb:27017 --eval 'JSON.stringify(rs.status().ok)')" != "1" ]; then
          for i in $$(seq 1 30); do
            mongosh --host mongodb:27017 --eval 'rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongodb:27017" }] })' && break
            echo 'waiting for mongo...'; sleep 2
          done
        fi
    networks:
      - backend

  mongo-express:
    container_name: mongo-express
    image: mongo-express
    restart: always
    ports:
      - '28081:8081'
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_DB_ADMIN_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_DB_ADMIN_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - backend

volumes:
  dbdata6:

networks:
  backend:
    driver: bridge
