services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: main-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - 22181:2181
    networks:
      - backend
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - 29092:29092
    hostname: kafka
    environment: 
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - backend
    healthcheck:
      test: nc -z localhost 29092

  init-kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: init-kafka
    depends_on:
      kafka:
        condition: service_healthy
    restart: 'no'
    # One-shot topic bootstrap, same pattern as init-mongo in storages.yaml.
    # The app never creates topics: it only produces/consumes, so on a cold
    # broker every first send/subscribe races the broker's auto-create and
    # aiokafka floods the log with "Topic X is not available during auto-create
    # initialization" (plus a roundrobin "No partition metadata for topic X")
    # until the topic finally materializes. Creating them up front removes the
    # race and the log noise; the app contract is unchanged.
    # Idempotent: --if-not-exists makes a re-run over an existing cluster a
    # no-op. The `for` loop retries because the healthcheck (`nc -z`) only
    # proves the port is open, not that the broker can serve topic requests yet.
    # $$ = literal $ after compose interpolation; the `:-` defaults mirror the
    # Config defaults in settings/config.py so this works without ../.env too.
    command:
      - bash
      - -c
      - |
        topics="$${NEW_CHATS_EVENT_TOPIC:-new-chats-topic} $${NEW_MESSAGE_RECEIVED_TOPIC:-new-messages} $${CHAT_DELETED_TOPIC:-chat-deleted-topic} $${NEW_LISTENER_ADDED_TOPIC:-listener-added-topic}"
        for topic in $$topics; do
          for i in $$(seq 1 30); do
            if kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --replication-factor 1 --partitions 1 --topic "$$topic"; then
              break
            fi
            echo "waiting for kafka... ($$topic)"; sleep 2
          done
        done
    env_file:
      - ../.env
    networks:
      - backend

  kafka-ui:
    image: provectuslabs/kafka-ui
    container_name: kafka-ui
    ports:
      - 8090:8080
    restart: always
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092
      - KAFKA_CLUSTERS_0_ZOOKEEPER=zookeeper:2181
    links:
      - kafka
      - zookeeper
    networks:
      - backend
networks:
  backend:
    driver: bridge