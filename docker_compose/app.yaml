services:
  main-app:
    build:
      context: ..
      dockerfile: Dockerfile
      # The Dockerfile's last stage is the slim prod image (what CD pushes to
      # GHCR); local dev needs the dev stage: dev-group tools + root user.
      target: dev
    container_name: main-app
    ports:
      - "${API_PORT}:8000"
    command: "uvicorn --factory application.api.main:create_app --timeout-graceful-shutdown 2 --reload --host 0.0.0.0 --port 8000 --ws=websockets"
    env_file:
      - ../.env
    volumes:
      - ../app/:/app/
    networks:
      - backend
    depends_on:
      kafka:
        condition: service_healthy

networks:
  backend:
    driver: bridge