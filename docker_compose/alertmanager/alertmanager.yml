# Alertmanager configuration (ADR-0007, Chunks 2-3; Telegram transport per §4).
#
# Routing mirrors the runbook split: critical pages immediately (no batching),
# warnings are grouped per subsystem. oncall-critical and team-warnings use DUAL
# delivery: the built-in telegram_configs receiver (AM calls api.telegram.org
# directly; token/chat_id come from /run/secrets/* files — AM config cannot
# expand env vars) AND the app's webhook sink (POST /ops/alerts -> structured
# JSON logs, Loki-visible). default-log stays webhook-only (dev catch-all, must
# never page).
#
# Validate with:
#   docker run --rm --entrypoint amtool -v <file>:/etc/alertmanager/alertmanager.yml:ro \
#     prom/alertmanager:latest check-config /etc/alertmanager/alertmanager.yml
route:
  receiver: default-log           # catch-all: must exist, must never page
  group_by: ['alertname', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # critical pages immediately, no batching delay
    - matchers:
        - severity = "critical"
      receiver: oncall-critical
      group_wait: 0s
      repeat_interval: 1h
      continue: false
    # warnings grouped per subsystem
    - matchers:
        - severity = "warning"
      receiver: team-warnings
      group_wait: 5m
      repeat_interval: 12h
      continue: false

receivers:
  - name: default-log
    webhook_configs:
      - url: 'http://main-app:8000/ops/alerts'
        send_resolved: true
  - name: oncall-critical
    telegram_configs:
      - bot_token_file: '/run/secrets/telegram_bot_token'
        chat_id_file: '/run/secrets/telegram_chat_id'
        api_url: 'https://api.telegram.org'
        parse_mode: 'HTML'
        send_resolved: true
    webhook_configs:
      - url: 'http://main-app:8000/ops/alerts'
        send_resolved: true
  - name: team-warnings
    telegram_configs:
      - bot_token_file: '/run/secrets/telegram_bot_token'
        chat_id_file: '/run/secrets/telegram_chat_id'
        api_url: 'https://api.telegram.org'
        parse_mode: 'HTML'
        send_resolved: true
    webhook_configs:
      - url: 'http://main-app:8000/ops/alerts'
        send_resolved: true

# Inhibition pairs encode the drill's causal story (ADR-0007 Chunk 2):
# an open circuit explains relay failures; a dead consumer makes reconnect
# noise irrelevant. While the source fires, targets are not notified.
inhibit_rules:
  - source_matchers:
      - alertname = "OutboxRelayCircuitOpen"
    target_matchers:
      - alertname = "OutboxRelayFailing"
    equal: ['job']
  - source_matchers:
      - alertname = "KafkaConsumerDown"
    target_matchers:
      - alertname = "KafkaConsumerReconnecting"
    equal: ['job']
