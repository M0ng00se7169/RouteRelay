# Prometheus alert rules for the kafka-chat stack (ADR-0006, Chunk 7.2).
#
# Mounted into the prometheus container by docker_compose/prometheus.yaml and
# loaded via `rule_files` in prometheus.yml. Rules are evaluated with the
# global evaluation_interval (15s).
#
# Threshold notes:
# - OutboxBacklogGrowing's 200 is CALIBRATED from the 2026-09-17 Locust baseline
#   (50 users, ~16 msg/s sustained, 3 min: outbox_pending max=35, p95=21, avg=6.4;
#   relay published 2864 rows with 0 errors and drained to 0 after the run).
#   Rationale: ~6x the observed max; 2x the relay's per-tick drain capacity
#   (batch_size=100 per 1s poll ~= 100 msg/s), so exceeding 200 requires producers
#   to outrun the relay by >100 msg/s for the full `for` window — the unbounded-
#   backlog scenario this alert exists for. Recalibrate after major load-profile
#   changes (see loadtest/locustfile.py).
# - The consumer-down rule is guarded by `up{job='kafka-chat-api'} == 1` so a
#   dead app (target down, no fresh samples) does not page for the consumer
#   being down on top of it.
# - KafkaConsumerReconnecting uses `increase(...[15m]) > 0` as a recency
#   signal: reconnects are self-healing (the loop retries with exponential
#   backoff, O-1 fix), so this alert deliberately tolerates a single broker
#   restart — it fires while there was at least one reconnect in the last
#   15 minutes and clears ~15m after the last one. Actual consumer death is
#   KafkaConsumerDown's job; if this alert becomes noisy, raise the window.
# - OutboxRelayCircuitOpen uses the same recency pattern on the relay's 'kafka'
#   breaker (O-2). circuit_breaker_rejected_total only counts GATE rejections
#   (sends skipped while the breaker is open) — the failures that trip the
#   breaker land in outbox_publish_errors_total instead. This closes the gap
#   where OutboxRelayFailing goes quiet precisely because the breaker stopped
#   the doomed sends. Recovery is automatic via the half-open probe
#   (CIRCUIT_BREAKER_RECOVERY_TIME, default 30s), so like the reconnect alert
#   this tolerates a brief outage and clears ~15m after the last rejection.
#   Response procedure (built from the 2026-09-25 live fire drill): see the
#   alert's runbook_url — docs/runbooks/kafka-outage.md.
groups:
  - name: kafka-chat
    rules:
      - alert: OutboxBacklogGrowing
        expr: outbox_pending > 200
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Outbox backlog is growing ({{ $value }} unsent rows)'
          runbook_url: 'docs/runbooks/kafka-outage.md'
          description: 'outbox_pending has been above 200 for 5 minutes — the relay is not draining the outbox (Kafka down, relay crashed, or producers outpacing it).'

      - alert: OutboxRelayFailing
        expr: rate(outbox_publish_errors_total[5m]) > 0
        labels:
          severity: warning
        annotations:
          summary: 'Outbox relay is failing to publish ({{ $value }} errors/s)'
          runbook_url: 'docs/runbooks/kafka-outage.md'
          description: 'The relay recorded publish errors in the last 5 minutes; failed rows stay unsent and are retried on the next tick.'

      - alert: OutboxRelayCircuitOpen
        expr: increase(circuit_breaker_rejected_total{name='kafka'}[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: 'Kafka circuit breaker open — relay sends skipped ({{ $value }} in 15m)'
          runbook_url: 'docs/runbooks/kafka-outage.md'
          description: 'The relay''s ''kafka'' circuit breaker is rejecting sends after repeated Kafka failures — the outbox batch is skipped while it stays open, so OutboxRelayFailing goes quiet. Rows stay unsent and drain once the half-open probe succeeds (recovery window CIRCUIT_BREAKER_RECOVERY_TIME, default 30s). If this repeats, check Kafka health (KafkaConsumerReconnecting/Down cover the consumer side).'

      - alert: KafkaConsumerDown
        expr: kafka_consumer_up == 0 and up{job='kafka-chat-api'} == 1
        labels:
          severity: critical
        annotations:
          summary: 'Kafka consumer loop is down while the app is up'
          runbook_url: 'docs/runbooks/kafka-consumer.md'
          description: 'kafka_consumer_up is 0 while the kafka-chat-api target is healthy — inbound broker messages are not reaching the WebSocket fan-out.'

      - alert: KafkaConsumerReconnecting
        expr: increase(kafka_consumer_reconnects_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: 'Kafka consumer reconnected recently ({{ $value }} in 15m)'
          runbook_url: 'docs/runbooks/kafka-consumer.md'
          description: 'The consumer loop reconnected to Kafka at least once in the last 15 minutes — the broker stream died (restart, network blip) or ended cleanly. Delivery self-heals via exponential backoff; if this repeats, investigate Kafka stability. Consumer death is covered by KafkaConsumerDown.'

      - alert: WSBroadcastFailures
        expr: rate(ws_broadcast_failures_total[5m]) > 0
        labels:
          severity: warning
        annotations:
          summary: 'WebSocket fan-out failures ({{ $value }} failures/s)'
          runbook_url: 'docs/runbooks/ws-fanout.md'
          description: 'Per-socket send failures during fan-out in the last 5 minutes — clients are dropping mid-broadcast (dead sockets no longer abort the fan-out, but the failures signal client instability).'
