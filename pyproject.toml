[tool.poetry]
name = "fastapi-examples"
version = "0.1.0"
description = ""
authors = ["M0ng00se7169 <nickkomarowski@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = {extras = ["httpx"], version = "^0.115.2"}
motor = "^3.6.0"
uvicorn = { extras = ["all"], version = "^0.32.0" }
ipython = "^8.28.0"
httpx = "^0.27.2"
pydantic-settings = "^2.6.0"
orjson = "^3.10.10"
websockets = "^13.1"
aiokafka = "0.10.0"


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
faker = "^30.6.0"
punq = "^0.7.0"
pre-commit = "^4.0.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "single"
indent-style = "tab"
docstring-code-format = true
docstring-code-line-length = 20

[tool.isort]
multi_line_output=3
include_trailing_comma=true
line_length=120
lines_after_imports=2
lines_between_sections=1
lines_between_types=0
force_alphabetical_sort_within_sections=true
ensure_newline_before_comments=true
combine_as_imports=true
combine_star=true
skip_gitignore=true
balanced_wrapping=true
force_grid_wrap=2
src_paths=["core", ]
skip_glob=[
    ".git",
    ".idea",
    ".vscode",
    "venv",
    ".venv",
]
