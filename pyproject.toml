[project]
name = "routerelay"
version = "0.1.0"
description = "Multi-user chat backend demonstrating DDD, CQRS, and event-driven architecture with FastAPI, Kafka, and MongoDB, plus a full observability and CI/CD stack."
authors = [
    { name = "M0ng00se7169", email = "nickkomarowski@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi[httpx]>=0.141.1,<0.142",
    "motor>=3.7.1,<4",
    "uvicorn[all]>=0.54.0,<0.55",
    "httpx>=0.28.1,<0.29",
    "pydantic-settings>=2.15.0,<3",
    "orjson>=3.12.0,<4",
    "websockets>=17.1,<18",
    "aiokafka>=0.14.0,<0.15",
    "aiojobs>=1.4.0,<2",
    "prometheus-client>=0.26.0,<0.27",
    "prometheus-fastapi-instrumentator>=8.1.0,<9",
    "punq>=0.9.0,<0.10",
    "python-multipart>=0.0.32,<0.1",
]

[dependency-groups]
dev = [
    "ipython>=9.17.1,<10",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "faker>=40.39.0,<41",
    "pre-commit>=4.6.2,<5",
    "ruff>=0.16.9,<0.17",
    # starlette.testclient prefers httpx2; plain httpx fallback is deprecated and
    # goes away in starlette 2.0. Runtime httpx stays (Telegram client + fastapi[httpx]).
    "httpx2>=2.13.1,<3",
]

# This repository is an application, not an installable distribution:
# Poetry stays in package-mode=false so `poetry install` manages the
# environment without trying to build/install the project itself.
[tool.poetry]
package-mode = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection passes Depends() in argument defaults by design.
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.isort]
# Flat import aliases (see docs/cqrs-contract.md) must sort as first-party.
known-first-party = ["application", "domain", "infrastructure", "logic", "settings", "tests"]

[tool.ruff.lint.per-file-ignores]
# RuntimeError sentinel as a default argument is a deliberate test-helper API.
"app/test/infrastructure/test_resilience.py" = ["B008"]
# Naive/local datetimes are deliberate in these fixtures and date comparisons.
"app/test/domain/values/test_messages.py" = ["DTZ002"]
"app/test/infrastructure/repositories/test_converters.py" = ["DTZ001"]

[tool.ruff.format]
quote-style = "single"
indent-style = "tab"
docstring-code-format = true
docstring-code-line-length = 20
