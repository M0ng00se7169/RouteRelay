global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/prometheus-alerts.yml

# ADR-0007 Chunks 1-2: alerts are sent to Alertmanager on the backend network
# (compose: docker_compose/alertmanager.yaml). Without this section Prometheus
# keeps alerts in its own UI only.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'kafka-chat-api'
    metrics_path: /metrics
    static_configs:
      # Prometheus does NOT substitute env vars in config files, and the target
      # must use the app's fixed CONTAINER port (8000) on the backend network —
      # ${API_PORT} is the host-side mapping and never resolves here.
      - targets: ['main-app:8000']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ADR-0007 Chunk 2: self-monitoring of Alertmanager (up{job="alertmanager"}).
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
