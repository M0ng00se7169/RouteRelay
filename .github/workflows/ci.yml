name: CI

# Quality gates for the kafka-chat backend. Mirrors the project's real
# workflow: the pre-commit suite (pyupgrade, ruff, add-trailing-comma —
# the repo deliberately does NOT use `ruff format`), a strict mypy type
# check over the whole app package, the pytest suite (fully self-contained:
# in-memory repositories, no Mongo/Kafka needed), config validation for
# the observability stack (promtool + amtool), and a build check for the
# app image.

on:
  push:
    branches: [main, features]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (pre-commit suite)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: pip install pre-commit==4.0.1

      # Same gate the repo enforces locally; --all-files keeps CI honest even
      # when a commit touches files the hooks would skip.
      - name: Run pre-commit on all files
        run: pre-commit run --all-files

  tests:
    name: Tests (pytest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        # Pin the exact uv version the uv.lock format was generated with
        # (same pin as the Dockerfile's builder image). The action's cache
        # covers both the uv binary and the downloaded wheels/interpreters.
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.19'
          enable-cache: true

      # No actions/setup-python here on purpose: uv reads .python-version
      # (3.12) and provisions the interpreter itself — same source of truth
      # as local dev and the Docker build.

      - name: Install dependencies (incl. dev group)
        # --frozen: CI must install the lockfile, never re-resolve. The
        # application repo has no [build-system], so there is no project
        # package to install — uv sync manages dependencies only.
        run: uv sync --frozen

      # The suite spins up in-memory repositories (app/test/fixtures.py) —
      # no MongoDB, Kafka or any other service required.
      - name: Run pytest
        working-directory: app
        run: uv run --frozen pytest -q

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        # Same pin as the tests job and the Dockerfile builder: one uv version
        # everywhere, and --frozen installs exactly the locked mypy.
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.19'
          enable-cache: true

      - name: Install dependencies (incl. dev group)
        run: uv sync --frozen

      - name: Cache mypy incremental state
        # Rolling cache (mypy docs pattern): key is unique per run so a fresh
        # snapshot is always saved; restore-keys picks the latest previous one
        # and mypy re-checks only what changed since it.
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            mypy-${{ runner.os }}-

      # NO working-directory here on purpose: [tool.mypy].files = ["app"] is
      # resolved relative to the repo root (pytest's app/-relative run is the
      # exception, not the rule).
      - name: Run mypy (strict)
        run: uv run --frozen mypy

  configs:
    name: Observability configs (promtool + amtool)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Validate Prometheus config and alert rules
        run: >
          docker run --rm --entrypoint promtool
          -v "${{ github.workspace }}/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
          -v "${{ github.workspace }}/docker_compose/prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml:ro"
          prom/prometheus:latest check config /etc/prometheus/prometheus.yml

      - name: Validate Alertmanager config
        run: >
          docker run --rm --entrypoint amtool
          -v "${{ github.workspace }}/docker_compose/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"
          prom/alertmanager:latest check-config /etc/alertmanager/alertmanager.yml

  docker-build:
    name: Docker image build
    runs-on: ubuntu-24.04
    # On main the CD pipeline builds and pushes the same SHA to GHCR —
    # building twice would be pure duplication.
    if: github.ref != 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build app image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
