name: CD

# Builds the app image and pushes it to GitHub Container Registry when
# main changes. Runs AFTER the CI pipeline reports success on the same
# commit, so nothing broken lands in the registry. The image is the
# portfolio artifact — pull with:
#   docker pull ghcr.io/m0ng00se7169/routerelay:latest
#
# Package visibility is independent of repo visibility: after the first
# successful run, flip the package public under
# https://github.com/users/M0ng00se7169/packages (if docker pull access
# for everyone is wanted).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # wait-on-check-action reads the Checks API for the CI run of this SHA
  checks: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & push image to GHCR
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Trust the quality gates, not the push event: this waits for the CI
      # run on the same SHA and fails the CD job if CI failed. Both gates
      # required: pytest (behavior) and mypy (types) — a type-broken main
      # must not ship either.
      - name: Await CI tests
        uses: lewagon/wait-on-check-action@v1.4.1
        with:
          ref: ${{ github.sha }}
          check-name: 'Tests (pytest)'
          wait-interval: 15
          # The Checks API rejects anonymous requests with 401 even on public
          # repos — always pass the workflow's own token.
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Await CI type check
        uses: lewagon/wait-on-check-action@v1.4.1
        with:
          ref: ${{ github.sha }}
          check-name: 'Type check (mypy)'
          wait-interval: 15
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
